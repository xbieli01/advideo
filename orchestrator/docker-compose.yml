# Local S3-compatible object store for the orchestrator (Storage:Provider=s3).
# Start: docker compose up -d ; console at http://localhost:9001 (minioadmin/minioadmin)
# Then set Storage__Provider=s3 and Storage__S3__ServiceUrl=http://localhost:9000
services:
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data

  # one-shot: create the bucket the orchestrator writes maps to
  createbucket:
    image: minio/mc:latest
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 minioadmin minioadmin; do sleep 1; done;
      mc mb --ignore-existing local/advideo-maps;
      exit 0;
      "

volumes:
  minio-data:
